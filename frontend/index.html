<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/df-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dayflow</title>
    <meta name="description" content="Every workday, perfectly aligned." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applied before first paint, otherwise a dark-theme user sees a cream
      // flash on every load. Kept inline and tiny for that reason.
      (function () {
        try {
          var stored = localStorage.getItem("dayflow-theme");
          var dark =
            stored === "dark" ||
            (!stored &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {
          /* private mode, blocked storage — light is a fine default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
